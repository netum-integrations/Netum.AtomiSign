name: Records_test_on_push
permissions:
  contents: read

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'Netum.AtomiSign.Records/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build
        working-directory: Netum.AtomiSign.Records
      - name: Test
        run: dotnet test
        working-directory: Netum.AtomiSign.Records

